<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Maintenance</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #111827;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background-color: #1f2937;
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      padding: 4.5rem 2.5rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.4rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      background-color: #38bdf8;
      border-radius: 50%;
    }
    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      color: #f9fafb;
    }
    .description {
      color: #9ca3af;
      font-size: 1rem;
      line-height: 1.6;
      max-width: 650px;
      margin: 0 auto 3rem auto;
    }
    hr {
      border: 0;
      border-top: 1px solid #374151;
      margin-bottom: 2.5rem;
    }
    .footer-text {
      color: #9ca3af;
      font-size: 0.92rem;
    }
    .footer-text a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
    }
    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      SCHEDULED MAINTENANCE
    </div>
    <h1>We're currently under maintenance</h1>
    <p class="description">
      Our report is undergoing necessary updates to improve your experience. We'll be back online shortly. Thank you for your patience!
    </p>
    <hr>
    <p class="footer-text">
      Need urgent support? Reach us at <a href="mailto:carlos.moreno02.ccs@usa.edu.co">carlos.moreno02.ccs@usa.edu.co</a>
    </p>
  </div>
</body>
</html>
